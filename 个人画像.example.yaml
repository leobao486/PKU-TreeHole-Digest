# 复制为“个人画像.yaml”后再填写；真实文件已被 .gitignore 排除。
个人信息:
  身份: 请填写学校、院系或职业阶段
  当前阶段: 请填写当前主要任务

近期目标:
  - 请填写近期最希望获得的信息

高优先级兴趣:
  - 课程、科研、升学或职业机会
  - 有明确时间节点的重要通知

一般兴趣:
  - 校园生活、活动、资源互助与实用技巧

降低优先级:
  - 纯情绪宣泄和重复争论
  - 广告、引流、代写和可疑交易

分类类别:
  - 重要通知
  - 学业与课程
  - 科研与学术
  - 升学与职业
  - 校园服务
  - 活动与兴趣
  - 资源互助
  - 技能与经验
  - 其他

特别规则:
  - 出现明确截止日期且与近期目标有关时，提高相关度
  - 学校正式通知优先于未经证实的转述
  - 涉及安全、健康或财务风险时提醒核实来源
