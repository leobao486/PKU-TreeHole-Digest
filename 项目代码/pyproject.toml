[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pku-treehole-digest"
version = "0.1.0"
description = "本地抓取、筛选并生成北大树洞每日摘要"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "keyring>=25.6.0",
  "PyYAML>=6.0.2",
  "requests>=2.32.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
pku-digest = "pku_treehole_digest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pku_treehole_digest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
